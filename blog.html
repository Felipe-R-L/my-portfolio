<!doctype html>
<html lang="en" class="blog">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- the reader's theme before the first paint, so a dark choice never flashes the paper -->
    <script>
      try {
        var theme = localStorage.getItem('blog-theme')
        if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
    <link
      rel="preload"
      href="/assets/fonts/cormorant-garamond-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/eb-garamond-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!--blog-head-->
  </head>
  <body>
    <a href="#article-body" class="skip-link">Skip to article</a>
    <!-- Chrome islands mount here. The article body below is static and never hydrates. -->
    <div id="blog-chrome"></div>
    <div id="blog-content"><!--blog-content--></div>
    <script type="application/json" id="blog-data"><!--blog-data--></script>
    <script type="module" src="/src/blog/main.tsx"></script>
  </body>
</html>
