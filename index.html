<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Desenvolvedor fullstack. Crio sites, lojas virtuais e sistemas sob medida para pequenos e médios negócios, do rascunho ao suporte." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://feliperl.space/" />
    <meta property="og:title" content="Felipe Rodrigues Leone | Sites, lojas virtuais e sistemas" />
    <meta property="og:description" content="Desenvolvedor fullstack. Crio sites, lojas virtuais e sistemas sob medida para pequenos e médios negócios, do rascunho ao suporte." />
    <meta property="og:image" content="https://feliperl.space/assets/og/home.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="Felipe Rodrigues Leone num terraço sobre a cidade" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://feliperl.space/" />
    <meta property="twitter:title" content="Felipe Rodrigues Leone | Sites, lojas virtuais e sistemas" />
    <meta property="twitter:description" content="Desenvolvedor fullstack. Crio sites, lojas virtuais e sistemas sob medida para pequenos e médios negócios, do rascunho ao suporte." />
    <meta property="twitter:image" content="https://feliperl.space/assets/og/home.jpg" />

    <title>Felipe Rodrigues Leone | Sites, lojas virtuais e sistemas</title>
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23050608'/%3E%3Crect x='7' y='9' width='18' height='14' rx='3' fill='none' stroke='%239fc3d6' stroke-width='2'/%3E%3C/svg%3E">
    
    <!--
      Critical resources, discoverable in the initial document so the browser
      can start fetching them before the JS bundle parses.

      The font and the hero portrait were previously only discovered after
      React mounted (LCP "requestDiscoverable: false"), and the font sat behind
      a chain of two third-party requests to Google. Both are now same-origin.
    -->
    <!--
      LCP: the photo the city hero is shot on, one version per device, split
      at the same breakpoint as useIsMobile.
    -->
    <link
      rel="preload"
      as="image"
      media="(min-width: 769px)"
      href="/assets/profile/scene-wide-3400.webp"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      media="(max-width: 768px)"
      href="/assets/profile/scene-tall-1800.webp"
      fetchpriority="high"
    />
    <link
      rel="preload"
      href="/assets/fonts/space-grotesk-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        scroll-behavior: smooth;
      }
      #root {
        height: 100%;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
