<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Felipe Rodrigues Leone - Full-Stack Developer specializing in Clean Architecture, DevOps, and High-Performance Web Applications. View my portfolio for projects and experience." />
    <meta name="keywords" content="Felipe Rodrigues Leone, Full-Stack Developer, React, TypeScript, Clean Architecture, Portfolio, Software Engineer" />
    <meta name="author" content="Felipe Rodrigues Leone" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://feliperl.space/" />
    <meta property="og:title" content="Felipe Rodrigues Leone | Full-Stack Developer" />
    <meta property="og:description" content="Building high-performance, scalable web solutions with a focus on Clean Architecture and Modern Technologies." />
    <meta property="og:image" content="https://feliperl.space/assets/profile/profile-640.webp" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://feliperl.space/" />
    <meta property="twitter:title" content="Felipe Rodrigues Leone | Full-Stack Developer" />
    <meta property="twitter:description" content="Building high-performance, scalable web solutions with a focus on Clean Architecture and Modern Technologies." />
    <meta property="twitter:image" content="https://feliperl.space/assets/profile/profile-640.webp" />

    <title>Felipe Rodrigues Leone | Full-Stack Developer Portfolio</title>
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
    
    <!--
      Critical resources, discoverable in the initial document so the browser
      can start fetching them before the JS bundle parses.

      The font and the hero portrait were previously only discovered after
      React mounted (LCP "requestDiscoverable: false"), and the font sat behind
      a chain of two third-party requests to Google. Both are now same-origin.
    -->
    <link
      rel="preload"
      href="/assets/fonts/space-grotesk-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="image"
      href="/assets/profile/profile-448.webp"
      imagesrcset="/assets/profile/profile-320.webp 320w, /assets/profile/profile-448.webp 448w, /assets/profile/profile-640.webp 640w"
      imagesizes="(max-width: 767px) 240px, (max-width: 1023px) 400px, 448px"
      fetchpriority="high"
    />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        scroll-behavior: smooth;
      }
      #root {
        height: 100%;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
