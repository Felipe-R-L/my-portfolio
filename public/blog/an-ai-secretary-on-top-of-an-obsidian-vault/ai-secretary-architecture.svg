<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 456' role='img' aria-label='Everything goes through the vault; a VM at home plans the day and sends it back to the phone' font-family='Inter, system-ui, sans-serif'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker></defs><text x='24' y='32' text-anchor='start' font-size='15' fill='rgba(255,255,255,0.9)' font-weight='600'>Everything goes through the vault; the VM plans the day and sends it back</text><rect x='24' y='176' width='712' height='144' rx='8' fill='rgba(255,255,255,0.04)' stroke='#6b7280' stroke-width='1'/><text x='40' y='200' text-anchor='start' font-size='13' fill='rgba(255,255,255,0.9)' font-weight='600'>Secretary VM · Proxmox at home</text><text x='720' y='200' text-anchor='end' font-size='11.5' fill='rgba(255,255,255,0.6)'>isolated from the other services</text><g fill='none' stroke='#6b7280' stroke-width='1.25'><path d='M224 92H290' marker-start='url(#a)' marker-end='url(#a)'/><path d='M470 92H536' marker-start='url(#a)' marker-end='url(#a)'/><path d='M380 128V216' marker-start='url(#a)' marker-end='url(#a)'/><path d='M626 128V176' stroke-dasharray='4 4' marker-end='url(#a)'/><path d='M410 360V304' marker-end='url(#a)'/><path d='M350 304V340H134V360' marker-end='url(#a)'/><path d='M626 304V360' marker-end='url(#a)'/></g><text x='257' y='82' text-anchor='middle' font-size='11.5' fill='rgba(255,255,255,0.6)'>Sync</text><text x='503' y='82' text-anchor='middle' font-size='11.5' fill='rgba(255,255,255,0.6)'>Sync</text><text x='390' y='156' text-anchor='start' font-size='11.5' fill='rgba(255,255,255,0.6)'>Obsidian Sync</text><text x='636' y='156' text-anchor='start' font-size='11.5' fill='rgba(255,255,255,0.6)'>Tailscale (ssh)</text><text x='420' y='344' text-anchor='start' font-size='11.5' fill='rgba(255,255,255,0.6)'>reads</text><text x='242' y='334' text-anchor='middle' font-size='11.5' fill='rgba(255,255,255,0.6)'>creates blocks</text><text x='636' y='344' text-anchor='start' font-size='11.5' fill='rgba(255,255,255,0.6)'>backup</text><rect x='44.0' y='56' width='180' height='72' rx='8' fill='none' stroke='#6b7280' stroke-width='1.25'/><text x='134' y='80' text-anchor='middle' font-size='13' fill='rgba(255,255,255,0.9)' font-weight='600'>iPhone</text><text x='134' y='98' text-anchor='middle' font-size='11.5' fill='rgba(255,255,255,0.6)'>text or audio to the Inbox</text><text x='134' y='114' text-anchor='middle' font-size='11.5' fill='rgba(255,255,255,0.6)'>gets Today.md and alerts</text><rect x='290.0' y='56' width='180' height='72' rx='8' fill='#4c8dff' fill-opacity='0.14' stroke='#4c8dff' stroke-width='2'/><text x='380' y='80' text-anchor='middle' font-size='13' fill='rgba(255,255,255,0.9)' font-weight='600'>Obsidian vault</text><text x='380' y='98' text-anchor='middle' font-size='11.5' fill='rgba(255,255,255,0.9)'>Agenda/: Inbox, Today,</text><text x='380' y='114' text-anchor='middle' font-size='11.5' fill='rgba(255,255,255,0.9)'>Routines and the rest</text><rect x='536.0' y='56' width='180' height='72' rx='8' fill='none' stroke='#6b7280' stroke-width='1.25'/><text x='626' y='80' text-anchor='middle' font-size='13' fill='rgba(255,255,255,0.9)' font-weight='600'>Desktop</text><text x='626' y='98' text-anchor='middle' font-size='11.5' fill='rgba(255,255,255,0.6)'>Obsidian and Claude Code</text><text x='626' y='114' text-anchor='middle' font-size='11.5' fill='rgba(255,255,255,0.6)'>ssh over the tailnet</text><rect x='44.0' y='216' width='180' height='88' rx='8' fill='none' stroke='#6b7280' stroke-width='1.25'/><text x='134' y='240' text-anchor='middle' font-size='13' fill='rgba(255,255,255,0.9)' font-weight='600'>Whisper (CPU)</text><text x='134' y='258' text-anchor='middle' font-size='11.5' fill='rgba(255,255,255,0.6)'>audio becomes text</text><text x='134' y='274' text-anchor='middle' font-size='11.5' fill='rgba(255,255,255,0.6)'>in Inbox.md</text><text x='134' y='290' text-anchor='middle' font-size='11.5' fill='rgba(255,255,255,0.6)'>every 15 min</text><rect x='290.0' y='216' width='180' height='88' rx='8' fill='none' stroke='#6b7280' stroke-width='1.25'/><text x='380' y='240' text-anchor='middle' font-size='13' fill='rgba(255,255,255,0.9)' font-weight='600'>Claude Code</text><text x='380' y='258' text-anchor='middle' font-size='11.5' fill='rgba(255,255,255,0.6)'>rounds at 7am, 1pm and 6pm</text><text x='380' y='274' text-anchor='middle' font-size='11.5' fill='rgba(255,255,255,0.6)'>weekly review on Sunday</text><text x='380' y='290' text-anchor='middle' font-size='11.5' fill='rgba(255,255,255,0.6)'>chat from the phone app</text><rect x='536.0' y='216' width='180' height='88' rx='8' fill='none' stroke='#6b7280' stroke-width='1.25'/><text x='626' y='240' text-anchor='middle' font-size='13' fill='rgba(255,255,255,0.9)' font-weight='600'>Git + rclone</text><text x='626' y='258' text-anchor='middle' font-size='11.5' fill='rgba(255,255,255,0.6)'>vault snapshot every hour</text><text x='626' y='274' text-anchor='middle' font-size='11.5' fill='rgba(255,255,255,0.6)'>daily backup at 3:30am</text><rect x='44.0' y='360' width='180' height='72' rx='8' fill='none' stroke='#6b7280' stroke-width='1.25'/><text x='134' y='384' text-anchor='middle' font-size='13' fill='rgba(255,255,255,0.9)' font-weight='600'>Secretary calendar</text><text x='134' y='402' text-anchor='middle' font-size='11.5' fill='rgba(255,255,255,0.6)'>time blocks with a</text><text x='134' y='418' text-anchor='middle' font-size='11.5' fill='rgba(255,255,255,0.6)'>10 min phone alert</text><rect x='290.0' y='360' width='180' height='72' rx='8' fill='none' stroke='#6b7280' stroke-width='1.25'/><text x='380' y='384' text-anchor='middle' font-size='13' fill='rgba(255,255,255,0.9)' font-weight='600'>External sources</text><text x='380' y='402' text-anchor='middle' font-size='11.5' fill='rgba(255,255,255,0.6)'>Gmail, GitHub, Calendar</text><text x='380' y='418' text-anchor='middle' font-size='11.5' fill='rgba(255,255,255,0.6)'>real calendar: read only</text><rect x='536.0' y='360' width='180' height='72' rx='8' fill='none' stroke='#6b7280' stroke-width='1.25'/><text x='626' y='384' text-anchor='middle' font-size='13' fill='rgba(255,255,255,0.9)' font-weight='600'>Google Drive</text><text x='626' y='402' text-anchor='middle' font-size='11.5' fill='rgba(255,255,255,0.6)'>off-site copy</text><text x='626' y='418' text-anchor='middle' font-size='11.5' fill='rgba(255,255,255,0.6)'>with the Git history</text></svg>